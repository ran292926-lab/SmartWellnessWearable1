{% extends "base.html" %}
{% block content %}
<h1>Create an account</h1>
<form method="post" action="/register">
  <label>Display name <input name="display_name" maxlength="50" value="{{ form.display_name if form }}" required></label>
  <label>Email <input type="email" name="email" value="{{ form.email if form }}" required></label>
  <label>Password <input type="password" name="password" minlength="8" maxlength="128" required></label>
  <label>Birth year <input type="number" name="birth_year" value="{{ form.birth_year if form }}" required></label>
  <label>Weight (kg) <input type="number" name="weight" step="0.1" value="{{ form.weight if form }}" required></label>
  <label class="check"><input type="checkbox" name="privacy_consent" value="yes"> I accept the privacy notice</label>
  <button>Create account</button>
</form>
<p>Already registered? <a href="/login">Log in</a></p>
{% endblock %}
