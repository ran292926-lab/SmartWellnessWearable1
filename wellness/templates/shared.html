{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <p class="eyebrow">Shared with you</p>
  <h1>People sharing with me</h1>
  <p class="lead">Wearers who accepted you as a trusted contact.</p>
</div>
<div class="narrow">
<section>
  <h2><span class="tile t-indigo"><svg width="18" height="18"><use href="#i-eye"/></svg></span>People sharing with me</h2>
  {% for w in sharing_with_me %}
  <p><a class="person-link" href="/wearers/{{ w.id }}"><span class="avatar">{{ w.display_name[:1]|upper }}</span><span class="grow">{{ w.display_name }}</span><svg class="ico" width="16" height="16"><use href="#i-arrow"/></svg></a></p>
  {% else %}<p class="empty">None.</p>{% endfor %}
</section>
</div>
{% endblock %}
